[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afc"
version = "1.0.0"
description = "Active flow control around a circular cylinder: immersed-boundary Navier-Stokes solver with a flapping tail"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3"]
dev = ["pytest>=7", "gymnasium>=0.29"]

[tool.setuptools]
packages = ["afc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
